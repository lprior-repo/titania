# Policy exceptions for the strict-ai profile.
# No owner, no reason, no expiry, no exception.

[[exceptions]]
rule_id = "BYPASS_EXPECT_ATTR"
path = "crates/titania-dylint/src/lib.rs"
owner = "titania-maintainers"
reason = "Dylint ABI exports require audited #[expect(unsafe_code)] on unsafe no_mangle exports, and register_lints also requires #[expect(clippy::no_mangle_with_rust_abi)] because Dylint documents a Rust-ABI no_mangle registration hook. Renewed 2026-10-16 after verifying the expects still fire (removal breaks deny(unsafe_code); allow() would trip BYPASS_PUB_ALLOW on the pub exports)."
expires_on = "2027-04-16"
review = "tn-xou8"
[[exceptions]]
rule_id = "BYPASS_CARGO_LINTS_WEAKENING"
path = "crates/titania-dylint/Cargo.toml"
owner = "titania-maintainers"
reason = "Dylint requires a local lint profile for its ABI-facing plugin build: the workspace forbids unsafe_code but the two #[unsafe(no_mangle)] exports need per-site #[expect], which forbid rejects, so unsafe_code must stay deny. Inheritance verified impossible 2026-10-16: cargo rejects [lints] workspace=true combined with any [lints.*] override. Local profile otherwise mirrors the workspace policy line-for-line."
expires_on = "2027-04-16"
review = "tn-lux5"
[[exceptions]]
rule_id = "FUNC_RECURSION_DIRECT"
path = "crates/titania-core/src/kani.rs"
owner = "titania-maintainers"
reason = "build_kani_diff_candidate retries once with the known-good line=1 shape after assert-failing; totality is documented at the site and the fallback path already fails verification by construction. An iterative rewrite would need Kani re-verification, which currently times out in this environment; re-evaluate when the kani lane executes within timeout."
expires_on = "2027-04-16"
review = "tn-mudh"

[[exceptions]]
rule_id = "DENY_ADVISORY"
path = "deny.toml"
owner = "titania-maintainers"
reason = "cargo-deny ignore for RUSTSEC-2024-0436 (paste 1.0.15 flagged unmaintained; a warning, not a vulnerability). paste reaches this workspace only transitively via dylint_linting 6.0.1 into crates/titania-dylint and is a build-time proc-macro helper with no runtime presence in the shipped titania-check binary; dylint_linting 6.0.1, pinned by nightly-2026-04-27, offers no maintained alternative and the dependency cannot be removed without dropping the dylint lane. Registered 2026-10-21 per §9.8 so the deny.toml suppression is no longer invisible; revisit when dylint_linting drops its paste dependency."
expires_on = "2027-04-16"
review = "audit-2026-10-21"

[[exceptions]]
rule_id = "BOUNDED_EXECUTION_UNBOUNDED_LOOP"
path = "crates/titania-core/src/kani.rs"
owner = "titania-maintainers"
reason = "build_kani_diff_candidate retries once with the known-good line=1 shape after kani::assert(false, ...): the Err branch always sets candidate_line = 1 and MutantId::new validates the fixed (p, a, 1, 1, AndOr) shape, so the second iteration cannot fail and the loop terminates. A bounded rewrite would need Kani re-verification, which currently times out in this environment; re-evaluate if this site changes or when the kani lane executes within timeout."
expires_on = "2027-04-16"
review = "tn-mudh"
