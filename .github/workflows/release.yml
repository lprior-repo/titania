# Titania release workflow.
#
# Triggered by a `v*` tag push (or manual dispatch). Delegates the build to
# Moon — Moon is the sole CI/CD orchestrator (commit 9a5c936) — and attaches
# the Moon-built release artifacts to the EXISTING GitHub Release for the
# tag. This workflow never creates tags or releases itself; it only uploads
# artifacts. Create the release (e.g. `gh release create v1.0.0`) before
# pushing the tag.
#
# The `titania-build` Moon task runs
# `cargo run --frozen --quiet -p titania-check -- run-lane build` with
# CARGO_TARGET_DIR=".titania/cache/build", and the build lane always passes
# `--release` itself, so the plain `moon run :titania-build` invocation
# below already yields release artifacts under `.titania/cache/build/release/`.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-27
          components: rustfmt,clippy,rust-src,llvm-tools-preview,rustc-dev

      - name: Install Moon
        uses: moonrepo/setup-moon-action@v2
        with:
          version: "2"

      - name: Moon release build
        run: moon run :titania-build

      - name: Stage and package release assets
        shell: bash
        env:
          REFNAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          build=".titania/cache/build/release"
          stage="${RUNNER_TEMP}/stage"
          mkdir -p "${stage}"
          cp "${build}/titania-check" "${stage}/"
          # Co-located dylint cdylib (type-aware lint library).
          for lib in libtitania_dylint.so libtitania_dylint.dylib titania_dylint.dll; do
            if [ -f "${build}/${lib}" ]; then cp "${build}/${lib}" "${stage}/"; fi
          done
          archive="titania-check-${REFNAME}.tar.gz"
          tar -C "${stage}" -czf "${archive}" .
          echo "asset=${archive}" >> "${GITHUB_ENV}"

      - name: Attach artifacts to the existing release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.asset }}
          fail_on_unmatched_files: true
          # Deliberately no generate_release_notes / draft flags: the action
          # must attach to the release that already exists for the tag and
          # fail loudly if it does not, instead of creating a release itself.
