# Embedded ast-grep architecture-rule catalog for Titania v1.
# These rules apply only to core/domain production Rust paths.

id: ARCHITECTURE_IMPORT_CORE_INFRA
language: Rust
severity: error
message: "ARCHITECTURE_IMPORT_CORE_INFRA: core/domain code must not import infrastructure crates"
files:
  - "src/core/**/*.rs"
  - "src/domain/**/*.rs"
  - "crates/*-core/src/**/*.rs"
  - "crates/*-domain/src/**/*.rs"
ignores:
  - "**/fixtures/**"
  - "**/tests/**"
  - "**/benches/**"
  - "**/examples/**"
  - "**/build.rs"
rule:
  any:
    - pattern: "use tokio::*;"
    - pattern: "use axum::*;"
    - pattern: "use sqlx::*;"
    - pattern: "use reqwest::*;"
    - regex: "\\buse\\s+(tokio|axum|sqlx|reqwest)::"
    - regex: "\\b(tokio|axum|sqlx|reqwest)::"
metadata:
  effect: Reject
  repair_hint: ReplaceDependency
---
id: ARCHITECTURE_IMPORT_CORE_FS
language: Rust
severity: error
message: "ARCHITECTURE_IMPORT_CORE_FS: core/domain code must use typed ports instead of direct filesystem, environment, or network I/O"
files:
  - "src/core/**/*.rs"
  - "src/domain/**/*.rs"
  - "crates/*-core/src/**/*.rs"
  - "crates/*-domain/src/**/*.rs"
ignores:
  - "**/fixtures/**"
  - "**/tests/**"
  - "**/benches/**"
  - "**/examples/**"
  - "**/build.rs"
rule:
  any:
    - pattern: "use std::fs::*;"
    - pattern: "use std::env::*;"
    - pattern: "use std::net::*;"
    - regex: "\\buse\\s+std::(fs|env|net)::"
    - regex: "\\buse\\s+std::(fs|env|net)\\b"
    - regex: "\\buse\\s+std::\\{[^}]*\\b(fs|env|net)\\b"
    - regex: "\\bstd::(fs|env|net)::"
metadata:
  effect: Reject
  repair_hint: RequiresHumanReview
---
id: ARCHITECTURE_IMPORT_CORE_TIME
language: Rust
severity: error
message: "ARCHITECTURE_IMPORT_CORE_TIME: core/domain code must accept time through an injected clock port"
files:
  - "src/core/**/*.rs"
  - "src/domain/**/*.rs"
  - "crates/*-core/src/**/*.rs"
  - "crates/*-domain/src/**/*.rs"
ignores:
  - "**/fixtures/**"
  - "**/tests/**"
  - "**/benches/**"
  - "**/examples/**"
  - "**/build.rs"
rule:
  any:
    - pattern: "use std::time::SystemTime;"
    - pattern: "use std::time::Instant;"
    - regex: "\\buse\\s+std::time::(SystemTime|Instant)\\b"
    - regex: "\\buse\\s+std::time::\\{[^}]*\\b(SystemTime|Instant)\\b"
    - regex: "\\bstd::time::(SystemTime|Instant)\\b"
metadata:
  effect: Reject
  repair_hint: RequiresHumanReview
---
id: ARCHITECTURE_IMPORT_CORE_RANDOM
language: Rust
severity: error
message: "ARCHITECTURE_IMPORT_CORE_RANDOM: core/domain code must accept entropy through an injected random source"
files:
  - "src/core/**/*.rs"
  - "src/domain/**/*.rs"
  - "crates/*-core/src/**/*.rs"
  - "crates/*-domain/src/**/*.rs"
ignores:
  - "**/fixtures/**"
  - "**/tests/**"
  - "**/benches/**"
  - "**/examples/**"
  - "**/build.rs"
rule:
  any:
    - pattern: "use rand::thread_rng;"
    - regex: "\\buse\\s+rand::thread_rng\\b"
    - regex: "\\buse\\s+rand::\\{[^}]*\\bthread_rng\\b"
    - regex: "\\brand::thread_rng\\b"
metadata:
  effect: Reject
  repair_hint: RequiresHumanReview
---
id: ARCHITECTURE_IMPORT_CORE_PROCESS
language: Rust
severity: error
message: "ARCHITECTURE_IMPORT_CORE_PROCESS: core/domain code must delegate process spawning to the shell through a typed port"
files:
  - "src/core/**/*.rs"
  - "src/domain/**/*.rs"
  - "crates/*-core/src/**/*.rs"
  - "crates/*-domain/src/**/*.rs"
ignores:
  - "**/fixtures/**"
  - "**/tests/**"
  - "**/benches/**"
  - "**/examples/**"
  - "**/build.rs"
rule:
  any:
    - pattern: "use std::process::Command;"
    - regex: "\\buse\\s+std::process\\b"
    - regex: "\\buse\\s+std::\\{[^}]*\\bprocess\\b"
    - regex: "\\bstd::process::"
    - regex: "\\btokio::process"
    - regex: "\\bstd::os::(unix|windows)::process"
metadata:
  effect: Reject
  repair_hint: RequiresHumanReview
---
id: ARCHITECTURE_EFFECT_CORE_ASYNC
language: Rust
severity: error
message: "ARCHITECTURE_EFFECT_CORE_ASYNC: core/domain code must stay synchronous; async execution belongs to the shell"
files:
  - "src/core/**/*.rs"
  - "src/domain/**/*.rs"
  - "crates/*-core/src/**/*.rs"
  - "crates/*-domain/src/**/*.rs"
ignores:
  - "**/fixtures/**"
  - "**/tests/**"
  - "**/benches/**"
  - "**/examples/**"
  - "**/build.rs"
rule:
  any:
    - pattern: "tokio::spawn($$$ARGS)"
    - regex: "\\basync\\s+fn\\b"
    - regex: "\\.await\\b"
    - regex: "\\btokio::(spawn|task|time)"
metadata:
  effect: Reject
  repair_hint: ReplaceDependency
---
id: ARCHITECTURE_EFFECT_CORE_STATE
language: Rust
severity: error
message: "ARCHITECTURE_EFFECT_CORE_STATE: core/domain code must not use ambient mutable state; pass explicit values through typed ports"
files:
  - "src/core/**/*.rs"
  - "src/domain/**/*.rs"
  - "crates/*-core/src/**/*.rs"
  - "crates/*-domain/src/**/*.rs"
ignores:
  - "**/fixtures/**"
  - "**/tests/**"
  - "**/benches/**"
  - "**/examples/**"
  - "**/build.rs"
rule:
  any:
    - pattern: "static mut $NAME: $TYPE = $INIT;"
    - regex: "\\bstatic\\s+mut\\b"
    - regex: "\\bstd::sync::(Mutex|RwLock)\\b"
    - regex: "\\bstd::cell::(Cell|RefCell|UnsafeCell)\\b"
    - regex: "\\bstd::thread::(spawn|sleep)\\b"
metadata:
  effect: Reject
  repair_hint: RequiresHumanReview
