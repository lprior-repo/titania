[package]
name = "titania-check"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "CLI front-end for Titania quality gates."
repository = "https://github.com/lprior-repo/titania"
readme = "../../README.md"
keywords = ["quality-gate", "ci", "lint", "moon", "cli"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "titania-check"
path = "src/main.rs"

[dependencies]
titania-core = { version = "1.0.0", path = "../titania-core" }
titania-aggregate = { version = "1.0.0", path = "../titania-aggregate" }
titania-output = { version = "1.0.0", path = "../titania-output" }
titania-lanes = { version = "1.0.0", path = "../titania-lanes" }
titania-policy = { version = "1.0.0", path = "../titania-policy" }
serde_json = "1.0"
wait-timeout = "0.2.1"

[build-dependencies]
serde_json = "1.0"

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.27.0"

[lints]
workspace = true
