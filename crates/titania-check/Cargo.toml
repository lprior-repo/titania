[package]
name = "titania-check"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "CLI front-end for Titania quality gates."
repository = "https://github.com/lprior-repo/titania"
readme = "../../README.md"
keywords = ["quality-gate", "ci", "lint", "moon", "cli"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "titania-check"
path = "src/main.rs"

# cargo-binstall wiring for v1-spec §14 distribution: `cargo binstall
# titania-check` fetches the per-target release archive and installs the
# titania-check binary from its root. binstall metadata can only place
# declared binary targets, so the co-located libtitania_dylint library
# (§7 path resolution step 3) cannot be expressed here; it must ship via
# the release artifact itself or a source install.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
titania-core = { version = "1.0.0", path = "../titania-core" }
titania-aggregate = { version = "1.0.0", path = "../titania-aggregate" }
titania-output = { version = "1.0.0", path = "../titania-output" }
titania-lanes = { version = "1.0.0", path = "../titania-lanes" }
titania-policy = { version = "1.0.0", path = "../titania-policy" }
serde.workspace = true
serde_json = "1.0"
toml_edit = { workspace = true, features = ["serde"] }
wait-timeout = "0.2.1"

[build-dependencies]
serde_json = "1.0"

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.27.0"

[lints]
workspace = true
